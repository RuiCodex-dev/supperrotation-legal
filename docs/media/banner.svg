<text x="86" y="234" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Inter,Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="500" fill="#dbe6ff">no repeats, shopping list done.</text>
</g>
<g class="rise" style="animation-delay:.65s" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Inter,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600">
<rect x="86" y="258" width="190" height="30" rx="15" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".18"/>

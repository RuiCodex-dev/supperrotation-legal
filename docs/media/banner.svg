<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="Supper Rotation legal pages: the privacy policy for the Android family dinner rotation app, in five languages">
<title>Supper Rotation: legal pages</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#121c33"/><stop offset=".5" stop-color="#1b2a4a"/><stop offset="1" stop-color="#14408a"/></linearGradient>
<radialGradient id="g1" cx=".08" cy="0" r=".55"><stop offset="0" stop-color="#8ab4f8" stop-opacity=".38"/><stop offset="1" stop-color="#8ab4f8" stop-opacity="0"/></radialGradient>
<radialGradient id="g2" cx="1" cy="1" r=".65"><stop offset="0" stop-color="#1a73e8" stop-opacity=".62"/><stop offset="1" stop-color="#1a73e8" stop-opacity="0"/></radialGradient>
<radialGradient id="warm" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#f6b73c" stop-opacity=".30"/><stop offset="1" stop-color="#f6b73c" stop-opacity="0"/></radialGradient>
<radialGradient id="gloss" cx=".35" cy=".3" r=".7"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="tx" x1="0" x2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#bcd3ff"/></linearGradient>
<linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".04"/></pattern>
<clipPath id="card"><rect width="1280" height="360" rx="28"/></clipPath>
<mask id="tm"><text x="84" y="170" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Inter,Roboto,Helvetica,Arial,sans-serif" font-size="68" font-weight="800" letter-spacing="-1.8" fill="#fff">Supper Rotation</text></mask>
</defs>
<style>
.ring{transform-box:view-box;transform-origin:1068px 184px;animation:turn 14s cubic-bezier(.65,0,.35,1) infinite}
@keyframes turn{0.000%{transform:rotate(0.000deg)}8.857%{transform:rotate(0.000deg)}14.286%{transform:rotate(-51.429deg)}23.143%{transform:rotate(-51.429deg)}28.571%{transform:rotate(-102.857deg)}37.429%{transform:rotate(-102.857deg)}42.857%{transform:rotate(-154.286deg)}51.714%{transform:rotate(-154.286deg)}57.143%{transform:rotate(-205.714deg)}66.000%{transform:rotate(-205.714deg)}71.429%{transform:rotate(-257.143deg)}80.286%{transform:rotate(-257.143deg)}85.714%{transform:rotate(-308.571deg)}94.571%{transform:rotate(-308.571deg)}100.000%{transform:rotate(-360.000deg)}}
.up{animation:up 14s cubic-bezier(.65,0,.35,1) infinite}
@keyframes up{0.000%{transform:rotate(0.000deg)}8.857%{transform:rotate(0.000deg)}14.286%{transform:rotate(51.429deg)}23.143%{transform:rotate(51.429deg)}28.571%{transform:rotate(102.857deg)}37.429%{transform:rotate(102.857deg)}42.857%{transform:rotate(154.286deg)}51.714%{transform:rotate(154.286deg)}57.143%{transform:rotate(205.714deg)}66.000%{transform:rotate(205.714deg)}71.429%{transform:rotate(257.143deg)}80.286%{transform:rotate(257.143deg)}85.714%{transform:rotate(308.571deg)}94.571%{transform:rotate(308.571deg)}100.000%{transform:rotate(360.000deg)}}
.halo{transform-box:view-box;transform-origin:1068px 78px;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
.orbit{transform-box:view-box;transform-origin:1068px 184px;animation:spin 60s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tk{stroke-dasharray:16;stroke-dashoffset:16;animation:draw .35s ease-out forwards}
.st{stroke-dasharray:140;stroke-dashoffset:140;animation:draw .5s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.rise{opacity:0;animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.shine{animation:shine 6s 1.2s ease-in-out infinite}
@keyframes shine{0%{transform:translateX(-420px)}40%,100%{transform:translateX(900px)}}
.steam{animation:steam 3.6s ease-in-out infinite}
@keyframes steam{0%{opacity:0;transform:translateY(6px)}40%{opacity:.7}100%{opacity:0;transform:translateY(-14px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.tk,.st{stroke-dashoffset:0}.rise{opacity:1}}
</style>
<g clip-path="url(#card)">
<rect width="1280" height="360" fill="url(#bg)"/><rect width="1280" height="360" fill="url(#g1)"/><rect width="1280" height="360" fill="url(#g2)"/>
<rect width="1280" height="360" fill="url(#grid)"/>

<g class="rise" style="animation-delay:.1s">
<text x="86" y="92" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Inter,Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="3" fill="#8ab4f8">RUI CODEX  ·  LEGAL &amp; PRIVACY</text>
</g>
<g class="rise" style="animation-delay:.25s">

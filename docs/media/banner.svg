<text x="517" y="278" text-anchor="middle" fill="#e8eaed">GDPR · Belgium</text>
<text x="86" y="318" font-weight="500" fill="#a3b8dd">EN · TR · DE · ES · FR   —   Android app com.ruicodex.supperrotation</text>
</g>

